[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-sdk"
version = "0.1.0"
description = "SDK for Amazon Kindle (Keyboard K3, DX) supporting Kindlets (J2ME CDC/PBP) and Modern C++"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
kindle-sdk = "kindle_sdk.cli:main"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/src"]
